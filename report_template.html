<style>

    --good: oklch(55% 0.14 155); --good-soft: oklch(95% 0.04 155);
    --warn: oklch(62% 0.14 70);  --warn-soft: oklch(96% 0.05 85);
    --meh: var(--muted-foreground);
  }
  .dark {
    --good: oklch(76% 0.15 155); --good-soft: oklch(30% 0.06 155);

         font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a:not(.btn) { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--muted-foreground); }
  .small { font-size: 12px; }

  /* Header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 32px 0 20px; }
  .top h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
  .top p { margin: 0; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .stat { padding: 16px 18px; gap: 4px; }
  .stat .label-row { display: flex; align-items: center; justify-content: space-between; }
  .stat .value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat svg { width: 16px; height: 16px; color: var(--muted-foreground); }

  /* Sticky toolbar */
  .toolbar { position: sticky; top: 0; z-index: 10; margin-top: 24px; padding: 12px 0;
             background: color-mix(in oklab, var(--background) 88%, transparent); backdrop-filter: blur(8px);
             border-bottom: 1px solid var(--border); }
  .toolbar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .toolbar .row + .row { margin-top: 10px; }
  .tabs nav { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs nav::-webkit-scrollbar { display: none; }
  .tabs [role=tab] .count { margin-left: 6px; font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .search { flex: 1 1 240px; min-width: 0; }
  .search input { width: 100%; }
  .toggles { display: flex; flex-wrap: wrap; gap: 16px; margin-left: auto; }
  .toggles .label { gap: 8px; font-weight: 500; cursor: pointer; }

  /* Sections */
  .section { margin-top: 28px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .section-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .section-head p { margin: 0; }
  .list { display: grid; gap: 12px; }

  /* Job card */
  .job { padding: 16px 18px; gap: 12px; transition: border-color .15s, box-shadow .15s; }
  .job:hover { border-color: color-mix(in oklab, var(--foreground) 22%, var(--border)); }
  .job.is-applied { opacity: .6; }
  .job-head { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: start; }
  .ring { --p: 50; --tone: var(--meh); position: relative; width: 48px; height: 48px; border-radius: 50%;
          background: conic-gradient(var(--tone) calc(var(--p) * 1%), var(--muted) 0); display: grid; place-items: center; }
  .ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
  .ring span { position: relative; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .ring.good { --tone: var(--good); } .ring.warn { --tone: var(--warn); }
  .job h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .job h3 a { text-decoration: none; }
  .job h3 .badge.new { margin-left: 8px; vertical-align: 2px; font-size: 11px; }
  .job h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .job .sub { margin: 2px 0 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge.low { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .why { margin: 0; }
  .flag { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: calc(var(--radius) - 2px);
          background: var(--warn-soft); color: var(--foreground); font-size: 13px; }
  .flag svg { flex: none; width: 15px; height: 15px; margin-top: 2px; color: var(--warn); }
  .extra { margin: 0; }
  .job-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .job-foot .spacer { flex: 1; }
  .job-actions { display: flex; gap: 8px; }

  /* Application kit */
  details.kit { border-top: 1px solid var(--border); margin: 0 -18px -16px; padding: 0 18px; }
  details.kit > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 12px 0;
                          font-weight: 500; }
  details.kit > summary::-webkit-details-marker { display: none; }
  details.kit > summary > svg:first-child { transition: transform .2s; color: var(--muted-foreground); }
  details.kit[open] > summary > svg:first-child { transform: rotate(90deg); }
  .kit-body { display: grid; gap: 10px; padding-bottom: 16px; }
  .kit-direct { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px;
                border-radius: calc(var(--radius) - 2px); background: var(--good-soft); }
  .kit-direct p { margin: 0; flex: 1 1 260px; }
  .kit-block { border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 10px 12px; }
  .kit-block header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .kit-block header strong { font-size: 13px; font-weight: 600; }
  .kit-text { margin: 0; white-space: pre-wrap; }
  .kit-block ul { margin: 0; padding-left: 18px; }
  .kit-group { margin: 6px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); }
  mark.fill { background: var(--warn-soft); color: var(--foreground); border-radius: 4px; padding: 0 3px;
              box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--warn) 50%, transparent); }

  /* Earlier / applied collapsibles */
  details.more { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 8px; }
  details.more > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
                           padding: 12px 0; font-size: 16px; font-weight: 600; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary svg { width: 16px; height: 16px; transition: transform .2s; color: var(--muted-foreground); }
  details.more[open] > summary svg { transform: rotate(90deg); }

  .empty-state { padding: 40px 16px; border: 1px dashed var(--border); border-radius: var(--radius); text-align: center; }
  .empty-state h3 { margin: 0 0 4px; font-size: 15px; }
  footer.page { padding: 40px 0 56px; }

  @media (max-width: 640px) {
    .top { padding-top: 20px; }
    .job-head { grid-template-columns: 40px 1fr; }
    .ring { width: 40px; height: 40px; } .ring span { font-size: 13px; }
    .job-actions { grid-column: 1 / -1; }
    .toggles { margin-left: 0; }
  }
</style>
</head>

        el("button", { class: "btn", "data-variant": isApplied ? "secondary" : "ghost", "data-size": "sm", type: "button", onclick: toggle(applied, "jh.applied") },
           [icon("check"), isApplied ? " Applied" : " Mark applied"]),
        el("button", { class: "btn", "data-variant": "ghost", "data-size": "sm", type: "button", onclick: toggle(hidden, "jh.hidden") },
           [icon("eyeoff"), isHidden ? " Unhide" : " Hide"]),
        url ? copyBtn : null
      ]),
      j.kit ? kitPanel(j.kit) : null
    ]);
  }

  function section(title, hint, jobs) {
    if (!jobs.length) return null;
    return el("section", { class: "section" }, [
      el("div", { class: "section-head" }, [
        el("h2", { text: title }),
        el("span", { class: "badge", "data-variant": "secondary", text: String(jobs.length) }),
        el("p", { class: "muted small", text: hint })
      ]),
      el("div", { class: "list" }, jobs.map(card))
    ]);
  }

  function emptyState(msg) {
    return el("div", { class: "empty-state section" }, [el("h3", { text: "No jobs match" }), el("p", { class: "muted", text: msg })]);
  }

  function render() {
    var main = document.getElementById("main");
    main.textContent = "";
    var list = JOBS.filter(visible).sort(sorter);
    var nodes = [
      section("Apply now", "Strong fit and eligible from India. Start here.", list.filter(function (j) { return j.score >= 70; })),
      section("Worth a look", "Partial fit or a stretch. Skim before applying.", list.filter(function (j) { return j.score < 70; }))
    ].filter(Boolean);
    if (!nodes.length) nodes.push(emptyState(state.maxAge < 168
      ? "Nothing posted in this time range matches. Try “Past week” or another tab."
      : "Nothing matches the current filters. Try another tab or clear the search."));
    nodes.forEach(function (n) { main.appendChild(n); });
    renderTabs();
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.textContent = "";
    var counts = {};
    JOBS.forEach(function (j) {
      if (!passesFilters(j)) return;
      counts.all = (counts.all || 0) + 1; counts[j.region] = (counts[j.region] || 0) + 1;
    });
    if (state.region !== "all" && !counts[state.region]) state.region = "all";
    REGION_TABS.forEach(function (t) {
      if (t[0] !== "all" && !counts[t[0]]) return;
      nav.appendChild(el("button", { type: "button", role: "tab", "aria-selected": String(state.region === t[0]),
        onclick: function () { state.region = t[0]; render(); } },
        [t[1], el("span", { class: "count", text: String(counts[t[0]] || 0) })]));
    });
  }

  function stat(label, value, hint, ico) {
    return el("div", { class: "card stat" }, [
      el("div", { class: "label-row" }, [el("span", { class: "muted small", style: "font-weight:500", text: label }), icon(ico)]),
      el("div", { class: "value", text: String(value) }),
      el("div", { class: "muted small", text: hint })
    ]);
  }

  // ---- static bits ----
  var stats = document.getElementById("stats");
  [
    stat("Apply now", JOBS.filter(function (j) { return j.score >= 70; }).length, "score 70+, posted in the past week", "target"),
    stat("New since last run", JOBS.filter(function (j) { return j.is_new; }).length, "from " + META.fetched.toLocaleString() + " postings scanned", "spark"),
    stat("Posted in 24 hours", JOBS.filter(function (j) { var h = ageHours(j); return h != null && h <= 24; }).length, "apply early, fewer applicants", "clock"),
    stat("Low competition", JOBS.filter(isLow).length, "under 50 applicants", "users"),
    stat("Application kits", JOBS.filter(function (j) { return j.kit; }).length, "drafted answers ready to review", "file")
  ].forEach(function (n) { stats.appendChild(n); });

  document.getElementById("subtitle").textContent = META.candidate + " · " + META.generated;
  document.getElementById("foot").textContent = "Sources: " + Object.keys(META.by_source).map(function (k) { return k + " " + META.by_source[k]; }).join(" · ") +
    ". Scores by Gemini against the resume; always check the posting before applying. Applied/hidden marks are saved in this browser only.";

  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("age").addEventListener("change", function (e) { state.maxAge = +e.target.value; render(); });
  var sortSel = document.getElementById("sort"); sortSel.value = state.sort;
  sortSel.addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  document.getElementById("lowOnly").addEventListener("change", function (e) { state.lowOnly = e.target.checked; render(); });
  document.getElementById("showDone").addEventListener("change", function (e) { state.showDone = e.target.checked; render(); });
  document.getElementById("theme").addEventListener("click", function () {
    var dark = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("jh.theme", dark ? "dark" : "light"); } catch (e) {}
  });
  render();
})();
</script>
</body>
</html>
